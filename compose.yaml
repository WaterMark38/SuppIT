# Starts the app using .env settings.
# Run locally with: docker compose up --build -d
# This runs only the Next.js backend. The database is your existing Neon project.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: suppit-phase4-clean:dev
    container_name: suppit-phase4-app
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - ./:/app
      - suppit_node_modules:/app/node_modules
      - suppit_next_cache:/app/.next
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  suppit_node_modules:
  suppit_next_cache:
